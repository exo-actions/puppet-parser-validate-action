name: CI

on:
  push:
    branches:
      - master         # Push events on master branch
  pull_request:        # Run tests for any PRs

jobs:
  # Run tests.
  # See also https://docs.docker.com/docker-hub/builds/automated-testing/
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Dockerfile lint
        uses: docker://replicated/dockerfilelint:09a5034
        with:
          args: Dockerfile

      - name: Docker build
        run: docker build . --file Dockerfile --tag image

      - name: Docker run
        run: docker run --entrypoint /opt/puppetlabs/bin/puppet image --version

      - name: Validate valid Puppet manifest (should pass)
        run: docker run -w /manifests -v ${{ github.workspace }}/test/fixtures:/manifests image valid.pp

      - name: Validate invalid Puppet manifest (should fail)
        run: |
          if docker run -w /manifests -v ${{ github.workspace }}/test/fixtures:/manifests image invalid.pp; then
            echo "Expected validation to fail but it succeeded"
            exit 1
          fi
